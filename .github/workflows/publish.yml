name: Update and publish the brief
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC: four attempts each day. GitHub can delay scheduled jobs.
    - cron: '17 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: kirish-brief-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Refresh sources and build edition
        env:
          # Both are optional. With neither configured, only source updates
          # are imported; the included starter explainers remain available.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          MAX_AI_SUMMARIES_PER_RUN: '4'
        run: python scripts/update.py
      - name: Preserve edition and source-check baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/feed-cache.json content/update-status.json site/data/brief.json site/data/brief.js
          if ! git diff --cached --quiet; then
            git commit -m "Update source-linked edition [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
